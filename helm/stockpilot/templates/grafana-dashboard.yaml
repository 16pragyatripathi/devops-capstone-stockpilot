{{- if .Values.monitoring.grafanaDashboard.enabled }}
# Picked up automatically by the Grafana dashboard sidecar in kube-prometheus-stack.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stockpilot.fullname" . }}-dashboard
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  stockpilot-overview.json: |-
{{ .Files.Get "dashboards/stockpilot-overview.json" | indent 4 }}
{{- end }}
