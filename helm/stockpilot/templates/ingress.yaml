{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "stockpilot.fullname" . }}
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          # /api/* (and the Swagger UI) go to FastAPI, everything else to the React app.
          {{- range list "/api" "/docs" "/openapi.json" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "stockpilot.backendService" $ }}
                port: { name: http }
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "stockpilot.frontendService" . }}
                port: { name: http }
{{- end }}
