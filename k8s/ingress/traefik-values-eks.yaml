# Traefik ingress controller on EKS, exposed through an internet-facing AWS Network Load Balancer.
# (ingress-nginx was retired by the Kubernetes project in 2026, so this project uses Traefik.)
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik
service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
ports:
  web:
    port: 8000
    exposedPort: 80
  websecure:
    exposedPort: 443
providers:
  kubernetesIngress:
    publishedService:
      enabled: true   # fills in the Ingress ADDRESS column with the NLB hostname
metrics:
  prometheus:
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
resources:
  requests: { cpu: 100m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }
